[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "resume-tailor"
version = "0.1.0"
description = "Tailor a LaTeX resume to a job description using RAG, LangChain and LangGraph"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",           # data validation + typed models (like DTOs)
    "pydantic-settings>=2.3",  # read settings from environment variables / .env
    "langchain-core>=0.3",     # LangChain building blocks: prompts, runnables, the | pipe
    "langchain-groq>=0.2",     # LangChain chat model for Groq
    "langgraph>=0.2",          # graphs with loops: rewrite -> validate -> retry
    "pyyaml>=6.0",             # read YAML files
    "fastembed>=0.4",          # local embeddings model (free, no API key)
    "numpy>=1.26",             # fast math on vectors
    "rank-bm25>=0.2.2",        # keyword search (BM25)
    "jinja2>=3.1",             # fill the LaTeX template
    "fastapi>=0.115",          # the web API
    "uvicorn[standard]>=0.30", # the server that runs the API
    "sqlalchemy>=2.0",         # talk to the database with Python classes
    "pwdlib[argon2]>=0.2",     # hash passwords (argon2)
    "pyjwt>=2.8",              # login tokens (JWT)
    "python-multipart>=0.0.9", # read form data and file uploads
    "pypdf>=4.0",              # read text from uploaded PDF resumes
    "alembic>=1.13",           # database migrations (versioned table changes)
    "psycopg[binary]>=3.1",    # PostgreSQL driver (used on the server)
    "httpx>=0.27",             # download the page behind a job link
]

[project.scripts]
resume-tailor = "core.cli:main"   # pip creates a "resume-tailor" command that runs main()

[project.optional-dependencies]
dev = [
    "pytest>=8.0",             # testing
    "ruff>=0.6",               # linter + formatter
]

[tool.setuptools.packages.find]
include = ["core*", "api*"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["migrations/versions"]   # generated by Alembic

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]   # errors, unused code, import order, modern syntax, common bugs

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]   # so tests can import each other (from tests.conftest import ...)
