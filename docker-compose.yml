# Run the whole backend: the API + a PostgreSQL database.
#
#   docker compose up --build
#   open http://localhost:8000/docs
#
# Needs in .env:  GROQ_API_KEY and JWT_SECRET (and POSTGRES_PASSWORD on a real server)

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: resume
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-only}
      POSTGRES_DB: resume
    volumes:
      - pgdata:/var/lib/postgresql/data # data survives restarts
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resume"]
      interval: 5s
      retries: 10

  api:
    build: .
    env_file: .env
    environment:
      ENVIRONMENT: prod
      DATABASE_URL: postgresql+psycopg://resume:${POSTGRES_PASSWORD:-local-dev-only}@db:5432/resume
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy # wait until the database is ready
    restart: unless-stopped

volumes:
  pgdata:
